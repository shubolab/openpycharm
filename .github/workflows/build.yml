name: Build native installers

on:
  push:
    branches: [main, 'codex_*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (for example 0.1.0-dev.3)'
        required: true
        default: '0.1.0-dev.3'
        type: string
      frontend:
        description: 'Include the experimental bundled frontend (set version to 0.1.0-dev.4)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installers:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
            sdk: .tools/platform/pycharm-2026.1.4-macos-arm64/PyCharm.app
            product: build/product/OpenPyCharm.app
          - target: windows-x64
            runner: windows-2022
            sdk: .tools/platform/pycharm-2026.1.4-windows-x64/pycharm
            product: build/product/OpenPyCharm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version || '0.1.0-dev.3' }}
      TARGET: ${{ matrix.target }}
      SDK: ${{ matrix.sdk }}
      PRODUCT: ${{ matrix.product }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Add Git's GNU patch on Windows
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $patchDirectory = 'C:\Program Files\Git\usr\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $patchDirectory 'patch.exe'))) {
            throw 'The Windows runner must provide Git for Windows GNU patch'
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $patchDirectory
      - name: Check Python, native architecture and disk reserve
        shell: bash
        run: |
          python - <<'PY'
          import os, platform, shutil, sys
          if sys.version_info < (3, 10):
              raise SystemExit('Python 3.10+ is required')
          expected = {'macos-arm64': ('Darwin', {'arm64'}), 'windows-x64': ('Windows', {'amd64', 'x86_64'})}
          system, machines = expected[os.environ['TARGET']]
          if platform.system() != system or platform.machine().lower() not in machines:
              raise SystemExit('Runner architecture does not match the installer target')
          free = shutil.disk_usage('.').free
          print(f'Free disk: {free / 1024**3:.1f} GiB')
          if free < 28 * 1024**3:
              raise SystemExit('This build requires 20 GiB reserve plus build space; use a larger or self-hosted runner')
          PY
      - name: Install pinned build dependencies and check source replay tools
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements-build.txt
          patch --version
      - name: Prepare a test-owned Python for real Notebook kernel controls
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, venv
          root = pathlib.Path('build/notebook-kernel-venv').absolute()
          if root.exists():
              raise SystemExit('The CI Notebook environment must be fresh')
          venv.EnvBuilder(with_pip=True).create(root)
          runtime = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(runtime), '-m', 'pip', 'install', '--disable-pip-version-check',
                          '--requirement', 'plugins/notebooks/kernel-requirements.txt'], check=True)
          subprocess.run([str(runtime), '-m', 'pip', 'check'], check=True)
          identity = subprocess.run([str(runtime), '-c',
              "import importlib.metadata as m,json,sys; print(json.dumps({'python':sys.executable,'version':sys.version,'packages':{n:m.version(n) for n in ['jupyter_client','ipykernel','pyzmq','tornado','psutil']}}))"],
              capture_output=True, text=True, timeout=15, check=True)
          receipt = json.loads(identity.stdout)
          expected = {'jupyter_client': '8.6.3', 'ipykernel': '6.29.5'}
          if any(receipt['packages'][name] != version for name, version in expected.items()):
              raise SystemExit('Notebook kernel dependency pins do not match')
          pathlib.Path('build/notebook-kernel-runtime.json').write_text(
              json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8', newline='\n') as output:
              output.write(f'OPENPYCHARM_NOTEBOOK_PYTHON={runtime}\n')
          print(identity.stdout)
          PY
      - name: Run repository controls
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: Check the Python example
        shell: bash
        working-directory: fixtures/hello-python
        run: |
          python main.py
          python -m unittest discover -s tests -v
      - name: Authenticate the open-source platform
        shell: bash
        run: python scripts/bootstrap.py --target "$TARGET"
      - name: Verify the SDK's bundled Java compiler
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          sdk = pathlib.Path(os.environ['SDK'])
          relative = 'Contents/jbr/Contents/Home/bin/javac' if os.environ['TARGET'] == 'macos-arm64' else 'jbr/bin/javac.exe'
          compiler = sdk / relative
          if not compiler.is_file():
              raise SystemExit('The authenticated SDK must contain its Java compiler')
          subprocess.run([str(compiler), '-version'], check=True)
          PY
      - name: Provision the pinned HTTP compiler into the owned cache
        shell: bash
        run: python scripts/provision_http_compiler.py
      - name: Compile and check HTTP protocol, lexer and archive against the native SDK
        shell: bash
        run: python scripts/build_http_plugin.py --sdk "$SDK" --version "$RELEASE_VERSION" --output "build/http-client-${TARGET}" --compiler-cache .tools/kotlin --test
      - name: Compile and check native framework commands, templates and request isolation
        shell: bash
        run: python scripts/build_framework_plugin.py --sdk "$SDK" --version "$RELEASE_VERSION" --test > "build/framework-${TARGET}.json"
      - name: Provision pinned JDBC drivers and matching LGPL source
        shell: bash
        run: python scripts/provision_database_drivers.py
      - name: Compile native Notebook and check model, merge and asynchronous persistence
        shell: bash
        run: python scripts/build_notebook_plugin.py --sdk "$SDK" --version "$RELEASE_VERSION" --tests > "build/notebooks-${TARGET}.json"
      - name: Check actual native JVM Notebook sessions with the selected owned kernel
        shell: bash
        run: python scripts/notebook_session_probe.py --sdk "$SDK" --version "$RELEASE_VERSION" --build-report "build/notebooks-${TARGET}.json" --python "$OPENPYCHARM_NOTEBOOK_PYTHON" --output "build/notebook-session-${TARGET}.json"
      - name: Compile native Database and check owned disposable SQLite integration
        shell: bash
        run: python scripts/build_database_plugin.py --sdk "$SDK" --version "$RELEASE_VERSION" --test > "build/database-${TARGET}.json"
      - name: Build and authenticate the optional bundled Frontend candidate
        if: inputs.frontend
        shell: bash
        run: |
          python - <<'PYFRONTEND'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from provision_frontend_tools import provision
          from build_frontend_product import build
          if os.environ['RELEASE_VERSION'] != '0.1.0-dev.4':
              raise SystemExit('The optional Frontend candidate currently requires version 0.1.0-dev.4')
          tools = provision(os.environ['TARGET'])
          plugin, report = build(pathlib.Path(os.environ['SDK']), pathlib.Path(tools['receipt']), os.environ['RELEASE_VERSION'])
          pathlib.Path('build/frontend-' + os.environ['TARGET'] + '.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8', newline='\n') as output:
              for name, value in {'OPENPYCHARM_FRONTEND_RUNTIME_RECEIPT': tools['receipt'],
                                  'OPENPYCHARM_FRONTEND_PRODUCT_SDK': str(pathlib.Path(os.environ['SDK']).absolute()),
                                  'OPENPYCHARM_FRONTEND_PRODUCT_BUNDLE': str(plugin)}.items():
                  output.write(f'{name}={value}\n')
          PYFRONTEND
      - name: Check actual JVM frontend settings, workers and full bundled runtime without launching Node
        if: inputs.frontend
        shell: bash
        run: python -m unittest discover -s tests/frontend -p test_frontend_product.py -v
      - name: Assemble the standalone product
        shell: bash
        run: |
          python - <<'PYASSEMBLE'
          import os, subprocess, sys
          command = [sys.executable, 'scripts/package.py', '--target', os.environ['TARGET'],
                     '--sdk', os.environ['SDK'], '--version', os.environ['RELEASE_VERSION'], '--output', os.environ['PRODUCT']]
          if os.environ.get('OPENPYCHARM_FRONTEND_RUNTIME_RECEIPT'):
              command.extend(['--frontend-runtime-receipt', os.environ['OPENPYCHARM_FRONTEND_RUNTIME_RECEIPT']])
          subprocess.run(command, check=True)
          PYASSEMBLE
      - name: Check native product startup with an isolated profile
        shell: bash
        run: python scripts/runtime_smoke.py --app "$PRODUCT" --profile "build/runtime-startup-${TARGET}"
      - name: Check actual cold Markdown preview rendering on macOS
        if: matrix.target == 'macos-arm64'
        shell: bash
        run: python scripts/markdown_probe.py --app "$PRODUCT" --sdk "$SDK" --profile "build/native-markdown-${TARGET}"
      - name: Check native Notebook edit, undo, save, merge and reopen
        shell: bash
        run: python scripts/notebook_save_probe.py --sdk "$SDK" --app "$PRODUCT" --workspace ".tools/native-notebook-save-${TARGET}" --run --timeout 180
      - name: Check actual bundled HTTP registration with an isolated native API probe
        shell: bash
        run: |
          python - <<'PY'
          import shutil
          shutil.copytree('plugins/http-client/examples', 'build/http-api-fixture',
                          ignore=shutil.ignore_patterns('.idea', '__pycache__', '*.pyc'))
          PY
          python scripts/native_probe.py --mode http --app "$PRODUCT" --sdk "$SDK" --project build/http-api-fixture --test-file build/http-api-fixture/demo.http --profile "build/native-http-${TARGET}" --report "build/native-http-${TARGET}/http-plugin.json" --delay 5 --timeout 90
      - name: Check packaged framework generation with real isolated venvs and dependency opt-in
        shell: bash
        run: |
          python scripts/framework_probe.py --app "$PRODUCT" --sdk "$SDK" --python "$(python -c 'import sys; print(sys.executable)')" --profile "build/native-framework-${TARGET}" --packaged --generators --timeout 180
          python scripts/framework_server_smoke.py --sdk "$SDK" --python "build/native-framework-${TARGET}/selected-venv/$([ "$TARGET" = windows-x64 ] && echo Scripts/python.exe || echo bin/python)" --projects "build/native-framework-${TARGET}/generated projects 中文" --output "build/framework-servers-${TARGET}"
      - name: Build and check the macOS DMG
        if: matrix.target == 'macos-arm64'
        shell: bash
        run: python scripts/installers.py --target "$TARGET" --version "$RELEASE_VERSION" --product "$PRODUCT"
      - name: Build and silently install/uninstall the Windows EXE
        if: matrix.target == 'windows-x64'
        shell: bash
        run: python scripts/installers.py --target "$TARGET" --version "$RELEASE_VERSION" --product "$PRODUCT" --verify-install
      - name: Retain installers and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenPyCharm-${{ matrix.target }}-${{ github.sha }}
          path: |
            build/installers/
            build/http-client-*/build.json
            build/http-client-*/protocol-tests.json
            build/framework-*.json
            build/notebooks-*.json
            build/notebook-kernel-runtime.json
            build/notebook-session-*.json
            build/database-*.json
            build/frontend-*.json
            build/framework-servers-*/framework-servers.json
            build/framework-servers-*/*.log
            build/product/**/openpycharm-build.json
            build/runtime-startup-*/startup.json
            build/runtime-startup-*/idea.properties
            build/runtime-startup-*/launcher-output.log
            build/runtime-startup-*/log/
            build/native-markdown-*/markdown-startup.json
            build/native-markdown-*/markdown-native.json
            build/native-markdown-*/idea.properties
            build/native-markdown-*/markdown-launch.log
            build/native-markdown-*/log/
            .tools/native-notebook-save-*/prepared.json
            .tools/native-notebook-save-*/native-report.json
            .tools/native-notebook-save-*/result.json
            .tools/native-notebook-save-*/external-timeout-threads.txt
            .tools/native-notebook-save-*/notebook-save-native-timeout-threads.txt
            .tools/native-notebook-save-*/launch.log
            .tools/native-notebook-save-*/profile/idea.properties
            .tools/native-notebook-save-*/profile/log/
            build/native-http-*/http-plugin.json
            build/native-http-*/idea.properties
            build/native-http-*/native-probe-launch.log
            build/native-http-*/log/
            build/native-framework-*/framework-probe.json
            build/native-framework-*/framework-native.json
            build/native-framework-*/idea.properties
            build/native-framework-*/framework-launch.log
            build/native-framework-*/log/
          if-no-files-found: warn
          # The native Notebook gate uses the explicitly listed owned .tools workspace.
          include-hidden-files: true
          retention-days: 14
      # Native Python Run/Test/Debug UI acceptance and release publication are
      # separate gates. Creating these artifacts does not publish a release.
