name: Transfer verified dev4 installers within GitHub

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: dev4-verified-draft-transfer
  cancel-in-progress: false

jobs:
  verified-draft-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: shubolab/openpycharm
    steps:
      - name: Transfer only verified installers into the fixed existing draft
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, subprocess, zipfile

          REPO = 'shubolab/openpycharm'
          TAG = 'v0.1.0-dev.4'
          RELEASE_ID = 445401980
          ITEMS = [
              {'target': 'macos-arm64', 'artifactId': 14119163167, 'archiveSize': 693250632,
               'archiveSha256': '840ad6505d0736df48ca04911922c7bfb74c1936af300984010f0f6dfef5691a',
               'name': 'OpenPyCharm-0.1.0-dev.4-macos-arm64.dmg', 'size': 745666387,
               'sha256': '5b07b72026108082a56da34cad2be600f56b04d99850c8a7e25176cf49eaaa76'},
              {'target': 'windows-x64', 'artifactId': 14119433953, 'archiveSize': 647582321,
               'archiveSha256': '6c5e73822667a892bd9823456721aed55ad670d5b97ca2ef6a93973ce08f56cd',
               'name': 'OpenPyCharm-0.1.0-dev.4-windows-x64-setup.exe', 'size': 646318653,
               'sha256': 'fa1dcf5e36e1a1f5e41e3859c6ee158101f148b75f4e4126dcc90d54621e8aa2'},
          ]
          EXPECTED = {i['name']: {'size': i['size'], 'digest': 'sha256:' + i['sha256']} for i in ITEMS}
          EXPECTED.update({
              'SHA256SUMS.txt': {'size': 323, 'digest': 'sha256:0896743799f151681525ffbcb569c6bff9a0953be4062f308ec95841789a0ca5'},
              'OpenPyCharm-0.1.0-dev.4-provenance.zip': {'size': 2171239, 'digest': 'sha256:db4325acc832110e25b23231e1f52ebfa97cecf40cfba239a5e48e127f113d48'},
          })
          work = Path('transfer-evidence'); work.mkdir()

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + REPO + '/' + path], text=True))

          def release():
              data = api('releases/' + str(RELEASE_ID))
              if data['id'] != RELEASE_ID or data['tag_name'] != TAG or data['draft'] is not True:
                  raise SystemExit('Fixed release is no longer the intended draft; no writes permitted')
              return data

          def check_asset(asset):
              expected = EXPECTED[asset['name']]
              if (asset['state'] != 'uploaded' or asset['size'] != expected['size']
                      or asset.get('digest') != expected['digest']):
                  raise SystemExit('Existing asset differs or is incomplete; refusing overwrite: ' + asset['name'])

          def sha(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()

          initial = release()
          if len(initial['assets']) != len({a['name'] for a in initial['assets']}):
              raise SystemExit('Duplicate release asset names')
          for asset in initial['assets']:
              if asset['name'] not in EXPECTED:
                  raise SystemExit('Unexpected existing release asset')
              check_asset(asset)
          receipts = []
          for item in ITEMS:
              current = release()
              existing = [a for a in current['assets'] if a['name'] == item['name']]
              if existing:
                  check_asset(existing[0]); receipts.append({'name': item['name'], 'alreadyVerified': True}); continue
              metadata = api('actions/artifacts/' + str(item['artifactId']))
              if (metadata['id'] != item['artifactId'] or metadata['expired'] is not False
                      or metadata['size_in_bytes'] != item['archiveSize']
                      or metadata.get('digest') != 'sha256:' + item['archiveSha256']):
                  raise SystemExit('Artifact API identity differs from the sealed record')
              archive = work / (item['target'] + '.zip')
              with archive.open('xb') as output:
                  subprocess.run(['gh', 'api', 'repos/' + REPO + '/actions/artifacts/' + str(item['artifactId']) + '/zip'],
                                 stdout=output, check=True, timeout=300)
              if archive.stat().st_size != item['archiveSize'] or sha(archive) != item['archiveSha256']:
                  raise SystemExit('Complete artifact ZIP size/SHA-256 mismatch')
              member = 'build/installers/' + item['name']
              installer = work / item['name']
              with zipfile.ZipFile(archive) as package:
                  names = package.namelist()
                  if len(names) != len(set(names)) or names.count(member) != 1:
                      raise SystemExit('Artifact entry identity or duplicate path mismatch')
                  info = package.getinfo(member)
                  if info.file_size != item['size'] or info.is_dir():
                      raise SystemExit('Installer entry size/type mismatch')
                  with package.open(info) as source, installer.open('xb') as output:
                      shutil.copyfileobj(source, output, 1024 * 1024)
              if installer.stat().st_size != item['size'] or sha(installer) != item['sha256']:
                  raise SystemExit('Standalone installer size/SHA-256 mismatch')
              # Recheck the fixed draft immediately before each write. No --clobber.
              release()
              subprocess.run(['gh', 'release', 'upload', TAG, str(installer), '--repo', REPO], check=True, timeout=300)
              uploaded = [a for a in release()['assets'] if a['name'] == item['name']]
              if len(uploaded) != 1: raise SystemExit('Uploaded asset was not uniquely observed')
              check_asset(uploaded[0])
              receipts.append({'name': item['name'], 'artifactId': item['artifactId'],
                               'archiveSize': item['archiveSize'], 'archiveSha256': item['archiveSha256'],
                               'size': item['size'], 'sha256': item['sha256'], 'assetId': uploaded[0]['id']})
              archive.unlink(); installer.unlink()
              print('Verified and uploaded ' + item['name'], flush=True)
          final = release()
          if {a['name'] for a in final['assets']} != set(EXPECTED): raise SystemExit('Final four-asset set differs')
          for asset in final['assets']: check_asset(asset)
          report = {'schema': 1, 'status': 'verified-draft-four-assets-uploaded', 'releaseId': RELEASE_ID,
                    'tag': TAG, 'releaseStillDraft': True, 'publishedByThisJob': False,
                    'sourceCiRun': 43608150941, 'workflowRun': os.environ['GITHUB_RUN_ID'],
                    'transfer': receipts, 'assets': [{k: a[k] for k in ('id', 'name', 'size', 'digest', 'state')} for a in final['assets']],
                    'installersExecuted': False, 'userCredentialForwarded': False}
          (work / 'receipt.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Retain compact transfer receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev4-draft-transfer-${{ github.run_id }}
          path: transfer-evidence/receipt.json
          if-no-files-found: warn
          retention-days: 14
